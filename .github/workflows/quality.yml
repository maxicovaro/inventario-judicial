name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend + MySQL
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: inventario_ci
          MYSQL_USER: inventario_ci
          MYSQL_PASSWORD: inventario_ci_password
          MYSQL_ROOT_PASSWORD: root_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: inventario_ci
      DB_USER: inventario_ci
      DB_PASSWORD: inventario_ci_password
      JWT_SECRET: ci_only_secret_not_for_real_environments_2026
      CORS_ORIGIN: http://localhost:5173
      AUTH_TOKEN_TRANSPORT: hybrid
      REQUIRE_ADMIN_MFA: false
      VITE_API_URL: http://localhost:3000/api
      E2E_BASE_URL: http://localhost:5173
      HEALTH_DB_TIMEOUT_MS: 2000
      SHUTDOWN_TIMEOUT_MS: 10000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Audit backend dependencies
        run: npm audit --audit-level=moderate

      - name: Validate backend syntax
        run: npm run check:backend

      - name: Run backend tests
        run: npm test

      - name: Prepare clean database
        run: npm run db:setup

      - name: Re-run migrations idempotently
        run: npm run db:migrate

      - name: Verify migration status
        run: npm run db:status

      - name: Run P9.4 pilot metrics snapshot smoke
        run: |
          rm -rf pilot-metrics-results
          timeout 30s npm run pilot:metrics:snapshot -- --days 7 --output pilot-metrics-results/ci.json
          node - <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(
            fs.readFileSync("pilot-metrics-results/ci.json", "utf8"),
          );
          if (data.schema_version !== 1) {
            throw new Error("Snapshot P9.4 con schema_version inesperado");
          }
          if (data.environment !== "test") {
            throw new Error(`Snapshot P9.4 ejecutado fuera de test: ${data.environment}`);
          }
          if (!data.window?.from || !data.window?.to) {
            throw new Error("Snapshot P9.4 sin ventana temporal válida");
          }
          if (!data.storage?.mysql || !data.usage || !data.consistency) {
            throw new Error("Snapshot P9.4 incompleto");
          }
          console.log("✓ Snapshot P9.4 CI finalizó y produjo JSON válido.");
          NODE

      - name: Run MySQL integration flows
        run: npm run test:integration

      - name: Run authentication hardening flows
        run: |
          node scripts/test-auth-hardening.js
          node scripts/test-login-concurrency.js

      - name: Run admin MFA flows
        env:
          AUTH_TOKEN_TRANSPORT: cookie
          REQUIRE_ADMIN_MFA: true
          MFA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: node scripts/test-mfa.js

      - name: Run concurrency and idempotency flows
        run: node scripts/test-concurrency.js

      - name: Verify runtime health
        run: npm run test:runtime-health

      - name: Ensure MySQL client tools
        run: |
          if ! command -v mysqldump >/dev/null 2>&1 || ! command -v mysql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y mysql-client || sudo apt-get install -y default-mysql-client
          fi
          mysqldump --version
          mysql --version

      - name: Verify backup and restore drill
        env:
          RESTORE_DB_HOST: 127.0.0.1
          RESTORE_DB_PORT: 3306
          RESTORE_DB_USER: root
          RESTORE_DB_PASSWORD: root_ci_password
        run: npm run test:backup-restore

      - name: Run P9.5 backup and restore drill
        env:
          RESTORE_DB_HOST: 127.0.0.1
          RESTORE_DB_PORT: 3306
          RESTORE_DB_USER: root
          RESTORE_DB_PASSWORD: root_ci_password
          PILOT_BACKUP_REQUIRE_SECONDARY: "true"
        run: |
          rm -rf pilot-backup-results
          npm run pilot:backup:run -- \
            --output-dir pilot-backup-results/daily \
            --external-dir pilot-backup-results/external \
            --keep 2 \
            --manifest pilot-backup-results/latest.json
          npm run pilot:restore:drill -- \
            --manifest pilot-backup-results/latest.json \
            --report pilot-backup-results/restore-drill.json
          node - <<'NODE'
          const fs = require("fs");
          const manifest = JSON.parse(fs.readFileSync("pilot-backup-results/latest.json", "utf8"));
          const drill = JSON.parse(fs.readFileSync("pilot-backup-results/restore-drill.json", "utf8"));
          if (
            manifest.schema_version !== 1 ||
            !manifest.sha256 ||
            !manifest.external_copy?.verified ||
            !manifest.secondary_copy_verified ||
            !manifest.source_snapshot?.tables ||
            !manifest.source_snapshot?.counts
          ) {
            throw new Error(
              "Backup P9.5 CI incompleto, snapshot ausente o copia secundaria no verificada",
            );
          }
          if (
            drill.schema_version !== 1 ||
            drill.status !== "PASS" ||
            !drill.validation?.exact_table_counts_match ||
            !drill.validation?.target_cleanup_ok ||
            !drill.objectives?.rpo_met ||
            !drill.objectives?.rto_met
          ) {
            throw new Error("Restore drill P9.5 CI no cumplió el contrato");
          }
          console.log("✓ Restore drill P9.5 CI finalizó con RPO/RTO dentro de objetivo.");
          NODE

      - name: Upload P9.5 backup/restore artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9-5-backup-restore
          path: pilot-backup-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Run P9.6 pilot exit gate
        run: |
          rm -rf pilot-exit-results
          npm run pilot:exit:gate -- \
            --evidence pilot/exit-gate.example.json \
            --output pilot-exit-results/ci.json
          node - <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(
            fs.readFileSync("pilot-exit-results/ci.json", "utf8"),
          );
          if (
            report.schema_version !== 1 ||
            report.technical_status !== "PASS" ||
            report.institutional_status !== "PENDING" ||
            report.decision !== "ELIGIBLE_FOR_INSTITUTIONAL_APPROVAL" ||
            report.failures?.length !== 0
          ) {
            throw new Error("Gate P9.6 CI no cumplió el contrato esperado");
          }
          console.log("✓ Gate P9.6 CI finalizó con PASS técnico y aprobación institucional pendiente.");
          NODE

      - name: Upload P9.6 exit gate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9-6-exit-gate
          path: pilot-exit-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Run P8.0 API baseline
        run: |
          npm run perf:fixtures

          cleanup_perf() {
            if [ -f /tmp/inventario-perf-backend.pid ]; then kill "$(cat /tmp/inventario-perf-backend.pid)" 2>/dev/null || true; fi
          }
          trap cleanup_perf EXIT

          node server.js > /tmp/inventario-perf-backend.log 2>&1 &
          echo $! > /tmp/inventario-perf-backend.pid

          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:3000/health/ready >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://localhost:3000/health/ready >/dev/null
          if ! npm run perf:baseline; then
            echo "--- Backend performance log ---"
            tail -200 /tmp/inventario-perf-backend.log || true
            exit 1
          fi

          cleanup_perf
          trap - EXIT

      - name: Upload P8.0 API baseline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-backend-baseline
          path: performance-results/api-baseline.json
          if-no-files-found: warn
          retention-days: 30

      - name: Run P8.1 backend/MySQL profile
        run: npm run perf:profile

      - name: Upload P8.1 backend profile artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-backend-profile
          path: performance-results/backend-profile.json
          if-no-files-found: warn
          retention-days: 30

      - name: Run P8.5 load profile
        run: npm run perf:load

      - name: Upload P8.5 load profile artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-load-profile
          path: performance-results/load-profile.json
          if-no-files-found: warn
          retention-days: 30

      - name: Run P8.6 stock contention profile
        run: npm run perf:stock-contention

      - name: Upload P8.6 stock contention artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-stock-contention
          path: performance-results/stock-contention-profile.json
          if-no-files-found: warn
          retention-days: 30

      - name: Prepare isolated E2E fixtures
        run: npm run test:integration:fixtures

      - name: Install frontend dependencies for E2E
        run: npm --prefix inventario-frontend ci

      - name: Install and audit Playwright Chromium
        run: |
          rm -rf .e2e-runtime
          mkdir -p .e2e-runtime
          printf '{"private":true,"devDependencies":{}}\n' > .e2e-runtime/package.json
          npm install --prefix .e2e-runtime --save-dev --package-lock=true @playwright/test@1.63.0
          npm --prefix .e2e-runtime audit --audit-level=moderate
          ./.e2e-runtime/node_modules/.bin/playwright install --with-deps chromium

      - name: Run critical browser E2E
        env:
          AUTH_TOKEN_TRANSPORT: cookie
          REQUIRE_ADMIN_MFA: true
          MFA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: |
          export E2E_TEST_PASSWORD="$(node -e 'process.stdout.write(require("./scripts/integration-fixtures").TEST_PASSWORD)' | tail -n 1)"
          export E2E_ADMIN_EMAIL="$(node -e 'process.stdout.write(require("./scripts/integration-fixtures").TEST_USERS.admin)' | tail -n 1)"
          export E2E_RESPONSABLE_EMAIL="$(node -e 'process.stdout.write(require("./scripts/integration-fixtures").TEST_USERS.responsable1)' | tail -n 1)"
          export E2E_USUARIO_EMAIL="$(node -e 'process.stdout.write(require("./scripts/integration-fixtures").TEST_USERS.usuario1)' | tail -n 1)"
          export NODE_PATH="$PWD/.e2e-runtime/node_modules"

          node - <<'NODE'
          const required = [
            "E2E_TEST_PASSWORD",
            "E2E_ADMIN_EMAIL",
            "E2E_RESPONSABLE_EMAIL",
            "E2E_USUARIO_EMAIL",
          ];
          for (const name of required) {
            const value = process.env[name] || "";
            if (!value || /[\r\n]/.test(value)) {
              throw new Error(`Variable E2E inválida: ${name}`);
            }
          }
          console.log("✓ Credenciales E2E cargadas sin contaminación de stdout.");
          NODE

          cleanup() {
            if [ -f /tmp/inventario-backend.pid ]; then kill "$(cat /tmp/inventario-backend.pid)" 2>/dev/null || true; fi
            if [ -f /tmp/inventario-frontend.pid ]; then kill "$(cat /tmp/inventario-frontend.pid)" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          node server.js > /tmp/inventario-backend.log 2>&1 &
          echo $! > /tmp/inventario-backend.pid

          npm --prefix inventario-frontend run dev -- --host 0.0.0.0 --port 5173 > /tmp/inventario-frontend.log 2>&1 &
          echo $! > /tmp/inventario-frontend.pid

          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:3000/health/ready >/dev/null && curl --fail --silent http://localhost:5173/ >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://localhost:3000/health/ready >/dev/null
          curl --fail --silent http://localhost:5173/ >/dev/null

          if ! ./.e2e-runtime/node_modules/.bin/playwright test --config=e2e/playwright.config.cjs; then
            echo "--- Backend log ---"
            tail -200 /tmp/inventario-backend.log || true
            echo "--- Frontend log ---"
            tail -200 /tmp/inventario-frontend.log || true
            exit 1
          fi

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventario-frontend
    env:
      VITE_API_URL: http://localhost:3000/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: inventario-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Measure P8.0 frontend baseline
        working-directory: .
        run: npm run perf:frontend

      - name: Upload P8.0 frontend baseline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-frontend-baseline
          path: performance-results/frontend-baseline.json
          if-no-files-found: warn
          retention-days: 30
