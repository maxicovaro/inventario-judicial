services:
  - type: web
    name: inventario-judicial-staging-free
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm --prefix inventario-frontend ci && VITE_API_URL=/api npm --prefix inventario-frontend run build
    preDeployCommand: npm run deploy:preflight
    startCommand: npm start
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: DEPLOY_ENV
        value: staging
      - key: SERVE_FRONTEND_STATIC
        value: "true"
      - key: FRONTEND_DIST_DIR
        value: inventario-frontend/dist
      - key: AUTH_TOKEN_TRANSPORT
        value: cookie
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: REQUIRE_ADMIN_MFA
        value: "true"
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: DB_SSL_CA_PATH
        value: /etc/ssl/certs/ca-certificates.crt
      - key: DB_PORT
        value: "4000"
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: PRODUCTION_DB_NAME
        value: inventario_judicial
      - key: JWT_SECRET
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: MFA_ISSUER
        value: Inventario Judicial
      - key: UPLOAD_STORAGE_MODE
        value: s3
      - key: UPLOAD_S3_ENDPOINT
        sync: false
      - key: UPLOAD_S3_BUCKET
        sync: false
      - key: UPLOAD_S3_REGION
        sync: false
      - key: UPLOAD_S3_ACCESS_KEY_ID
        sync: false
      - key: UPLOAD_S3_SECRET_ACCESS_KEY
        sync: false
      - key: UPLOAD_S3_FORCE_PATH_STYLE
        value: "false"
      - key: UPLOAD_S3_PREFIX
        value: uploads/staging-free
      - key: HEALTH_DB_TIMEOUT_MS
        value: "5000"
      - key: SHUTDOWN_TIMEOUT_MS
        value: "10000"
